name: Deploy Resume Website

on:
  push:
    branches:
      - master
  workflow_dispatch:
    inputs:
      simulate_predeploy_failure:
        description: "Lab test: fail before AWS deployment"
        required: true
        type: boolean
        default: false
  
permissions:
  contents: read

concurrency:
  group: resume-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout source
        uses: actions/checkout@v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          cache: npm
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Build website
        run: npm run build

      - name: Verify build output
        run: |
          test -s dist/index.html
          echo "Website build verified"

      - name: Lab - simulate pre-deployment failure
        if: ${{ inputs.simulate_predeploy_failure }}
        run: |
          echo "::error::Intentional lab failure before AWS deployment"
          exit 1

      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: arn:aws:iam::034381339374:role/GitHubActions-ResumeDeployRole
          aws-region: us-east-1
          role-session-name: resume-deploy-${{ github.run_id }}
          allowed-account-ids: '034381339374'

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Deploy website to S3
        run: |
          aws s3 sync dist/ s3://resume-1000 \
            --delete \
            --only-show-errors

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id E1XVCF6W63RXS8 \
            --paths "/*"
